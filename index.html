<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Ruled Note Bill</title>
<style>
body{margin:0;background:#eee;font-family:Arial}
#page{
width:800px;max-width:95%;margin:20px auto;padding:40px;position:relative;
background:
repeating-linear-gradient(white 0px,white 31px,#8ec5ff 32px);
box-shadow:0 0 10px #999;
}
 #page > *{
    position: relative;
    z-index: 1;
}
h2{margin:0 0 20px}
input{padding:8px;margin:5px}
button{padding:8px 14px}
.line{
color:#0b57d0;
font-size:22px;
height:32px;
margin-top:15px;
}
@media print{button,input,h2{display:none} body{background:#fff} #page{box-shadow:none;margin:0}}
</style></head>
<body>
<div id="page">
<div style="
position:absolute;
top:70%;
left:50%;
transform:translate(-50%,-50%);
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
pointer-events:none;
z-index:0;
opacity:0.08;">

    <img src="AS_Logo.png"
         style="width:600px;height:auto;">
</div>
 <div style="position:absolute;left:20px;top:15px;text-align:center;">
  <div style="font-size:10px;font-weight:bold;margin-bottom:4px;">
    Scan Me
  </div>
  <img src="WhatsApp_QR_Code.png" width="80" height="80" alt="WhatsApp QR">
</div>
<div style="text-align:center;font:600 11px Arial,sans-serif;color:#b8b8b8;letter-spacing:1px;margin:2px 0 10px 0;user-select:none;">This is Avinash Sona System Generated</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
<div></div>
<div style="font-size:15px">
<b>Date:</b> <span id="date"></span><br>
<b>Time:</b> <span id="time"></span>
</div>
</div>
<input id="item" placeholder="सामान">
<input id="amt" type="number" placeholder="₹">
<button onclick="add()">Add</button>
<button onclick="print()">PDF</button>
<button id="undoBtn" onclick="undoDelete()" style="display:none;">↩️ Undo</button>
<div id="list"></div>
<div class="line" id="total" style="position:fixed;right:40px;bottom:20px;text-align:right;color:#0b57d0;font-weight:bold;">कुल: ₹0</div>
</div>
<script>
let lastDeleted = null;
let items = JSON.parse(localStorage.getItem("items")) || [];
let t = 0;

function save() {
  localStorage.setItem("items", JSON.stringify(items));
}
function removeItem(index){
  lastDeleted = {
    item: items[index],
    index: index
  };

  items.splice(index,1);
  save();
  render();

  document.getElementById("undoBtn").style.display = "inline-block";
}

function undoDelete(){
  if(lastDeleted){
    items.splice(lastDeleted.index,0,lastDeleted.item);
    lastDeleted = null;
    save();
    render();

    document.getElementById("undoBtn").style.display = "none";
  }
}
function render() {
  list.innerHTML = "";
  t = 0;

  items.forEach((x, index) => {
    t += x.amount;

    let d = document.createElement("div");
    d.className = "line";
    d.style.display = "flex";
    d.style.justifyContent = "space-between";
    d.innerHTML = `
<label style="display:flex;justify-content:space-between;width:100%">
  <span>
    <input type="checkbox" ${x.done ? "checked" : ""}
    onchange="items[${index}].done=this.checked;save();render();">
    ${x.done ? "<s>"+x.name+"</s>" : x.name}
  </span>

  <span>
    ₹${x.amount.toFixed(2)}
    <button type="button"
onclick="removeItem(${index})"
style="background:#d32f2f;color:white;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;">
Delete
</button>
  </span>
</label>`;
    list.appendChild(d);
  });

  total.textContent = "कुल: ₹" + t.toFixed(2);
}

function add() {
  let i = item.value.trim();
  let a = parseFloat(amt.value);

  if (!i || isNaN(a)) return;

  items.push({
  name: i,
  amount: a,
  done: false
});
  save();
  render();

  item.value = "";
  amt.value = "";
}

function updateDT() {
  const n = new Date();
  date.textContent = n.toLocaleDateString("en-GB");
  time.textContent = n.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

render();
updateDT();
setInterval(updateDT, 1000);
 </script></body></html>
